name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-java-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Run Backend Tests
        run: |
          cd backend
          mvn test

  test-react-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm install
          npm run test

  build-java-api:
    runs-on: ubuntu-latest
    needs: test-java-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml

      - name: Upload Java Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: backend/target/*.war

  build-react-app:
    runs-on: ubuntu-latest
    needs: test-react-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist/

  containerize-backend:
    runs-on: ubuntu-latest
    needs: build-java-api
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: java-build
          path: backend/target/
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push Backend Image
        run: |
          cd backend
          docker build -t ghcr.io/${{ github.repository_owner }}/m324backend:latest .
          docker push ghcr.io/${{ github.repository_owner }}/m324backend:latest

  containerize-frontend:
    runs-on: ubuntu-latest
    needs: build-react-app
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend/dist/
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push Frontend Image
        run: |
          cd frontend
          docker build -t ghcr.io/${{ github.repository_owner }}/m324frontend:latest .
          docker push ghcr.io/${{ github.repository_owner }}/m324frontend:latest

  notify:
    runs-on: ubuntu-latest
    needs: [containerize-backend, containerize-frontend]
    steps:
      - name: Send Webhook Notification
        run: |
          curl -X POST -H 'Content-Type: application/json' \
          -d '{"text": "✅ Pipeline erfolgreich! Backend und Frontend Tests bestanden. Container sind online."}' \
          ${{ secrets.WEBHOOK_URL }}

  scan-backend:
    runs-on: ubuntu-latest
    needs: containerize-backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Download Trivy HTML template
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o trivy-html.tpl
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/m324backend:latest"
          format: "template"
          template: "@trivy-html.tpl"
          output: "trivy-results-backend.html"
      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-results
          path: trivy-results-backend.html

  scan-frontend:
    runs-on: ubuntu-latest
    needs: containerize-frontend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/m324frontend:latest"
          format: "sarif"
          output: "trivy-results-frontend.sarif"
      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-trivy-results
          path: trivy-results-frontend.sarif
